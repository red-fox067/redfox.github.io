<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel PS4</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
            margin: 0;
        }
        h1 {
            color: #0070d1;
            font-size: 28px;
        }
        p {
            color: #a0aab5;
            font-size: 16px;
        }
        .btn-container {
            margin-top: 40px;
        }
        button {
            background-color: #0070d1;
            color: white;
            border: none;
            padding: 22px 45px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 112, 209, 0.4);
        }
        button:focus, button:hover {
            background-color: #0085ff;
            outline: 4px solid #ffcc00;
        }
        #status {
            margin-top: 30px;
            font-size: 22px;
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Painel de Teste PS4</h1>
    <p>Pressione o botão para rodar o comando:</p>
    
    <div class="btn-container">
        <button onclick="executarPayload()">RUN</button>
    </div>
    
    <div id="status">Aguardando...</div>

    <script>
        function executarPayload() {
            const statusDiv = document.getElementById('status');
            
            // Aqui mudamos o texto para "executed" exatamente como você pediu
            statusDiv.innerText = "executed";
        }
    </script>

</body>
</html>
